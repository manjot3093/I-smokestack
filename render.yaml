services:
  - type: web
    name: sonia-clarity-studio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: VLLM_BASE_URL
        sync: false
      - key: VLLM_API_KEY
        sync: false
      - key: VLLM_MODEL
        value: Qwen/Qwen2.5-14B-Instruct-AWQ
      - key: VLLM_TIMEOUT_S
        value: "12"

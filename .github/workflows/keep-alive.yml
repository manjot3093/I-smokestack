name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier 15-minute idle spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_SERVICE_URL || vars.RENDER_SERVICE_URL || 'https://i-smokestack.onrender.com' }}
        run: |
          TARGET="${RENDER_URL%/}/api/health"
          echo "Pinging $TARGET"
          curl -fsS --retry 2 --retry-delay 5 --max-time 45 "$TARGET"
